<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pikki's Info: a fan-made decompose and crafting guide for Love Nikki. Track your wardrobe, wishlist and collections." />
    <meta name="theme-color" content="#fcf8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#150e21" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="preconnect" href="https://fosgctjofhkshfseaxgp.supabase.co" crossorigin />
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('pikkis-theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Pikki's Info · Decompose Guide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
